<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How to Read This Codebase</title>
  <style>
    :root {
      --bg: #0f1119;
      --panel: #161822;
      --panel-border: #1e2030;
      --text: #e2e8f0;
      --muted: #a0aec0;
      --dim: #718096;
      --faint: #4a5568;
      --accent: #63b3ed;
      --orange: #ed8936;
      --green: #48bb78;
      --blue: #63b3ed;
      --purple: #b794f4;
      --code-bg: #1a1a2e;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Layout */
    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .progress-bar { height: 3px; background: #1a1a2e; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--orange), var(--green), var(--blue), var(--purple));
      transition: width 0.4s ease;
    }

    /* Phase nav */
    .phase-nav {
      display: flex; justify-content: center; gap: 4px;
      padding: 14px 16px 6px; flex-wrap: wrap;
    }
    .phase-pill {
      padding: 5px 14px; border-radius: 20px; font-size: 12px;
      font-weight: 500; color: var(--faint); cursor: pointer;
      transition: all 0.25s; border: none; background: transparent;
    }
    .phase-pill.active { background: #2d3748; color: var(--text); font-weight: 700; }
    .phase-pill.done { color: var(--green); }

    /* Main content area */
    .main {
      flex: 1; display: flex; flex-direction: column;
      max-width: 740px; width: 100%; margin: 0 auto;
      padding: 12px 24px 24px;
    }
    .step-label {
      font-size: 12px; font-weight: 700; color: var(--accent);
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px;
    }
    .step-counter { color: var(--faint); margin-left: 8px; letter-spacing: normal; }
    .title {
      font-size: 26px; font-weight: 800; color: #f7fafc;
      line-height: 1.2; margin-bottom: 4px;
    }
    .subtitle { font-size: 15px; color: var(--dim); margin-bottom: 18px; }

    /* Visual panel */
    .visual-panel {
      background: var(--panel); border: 1px solid var(--panel-border);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
      min-height: 80px;
    }

    /* Description */
    .description {
      font-size: 15px; line-height: 1.75; color: var(--muted);
      white-space: pre-line; flex: 1;
    }
    .description strong { color: var(--text); font-weight: 600; }
    .description em { color: var(--accent); font-style: normal; }

    /* Code blocks */
    .code-block {
      background: var(--code-bg); border-radius: 12px;
      padding: 16px 20px; font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
      font-size: 13px; line-height: 1.8; overflow-x: auto;
    }
    .code-line {
      display: flex; gap: 14px; align-items: baseline;
      padding: 2px 0; border-left: 3px solid transparent;
      padding-left: 12px; margin-left: -12px; border-radius: 2px;
    }
    .code-line.hi {
      background: rgba(99, 179, 237, 0.08);
      border-left-color: var(--accent);
    }
    .code-line.hi-orange {
      background: rgba(237, 137, 54, 0.08);
      border-left-color: var(--orange);
    }
    .code-line.hi-green {
      background: rgba(72, 187, 120, 0.08);
      border-left-color: var(--green);
    }
    .code-line.hi-purple {
      background: rgba(183, 148, 244, 0.08);
      border-left-color: var(--purple);
    }
    .code-text { color: var(--dim); white-space: pre; flex-shrink: 0; }
    .code-line.hi .code-text,
    .code-line.hi-orange .code-text,
    .code-line.hi-green .code-text,
    .code-line.hi-purple .code-text { color: var(--text); }
    .code-note { color: var(--accent); font-size: 12px; white-space: nowrap; opacity: 0.9; flex-shrink: 0; }
    .code-note.orange { color: var(--orange); }
    .code-note.green { color: var(--green); }
    .code-note.purple { color: var(--purple); }

    /* Flow diagram */
    .flow { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; }
    .flow-box {
      border-radius: 12px; padding: 12px 28px; text-align: center;
      min-width: 260px; border-width: 2px; border-style: solid;
    }
    .flow-box-name { font-weight: 700; font-size: 15px; }
    .flow-box-desc { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .flow-arrow { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .flow-arrow-line { width: 2px; height: 12px; background: var(--faint); }
    .flow-arrow-label {
      background: #2d3748; padding: 3px 14px; border-radius: 20px;
      font-size: 11px; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .flow-arrow-tip {
      width: 0; height: 0;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 7px solid var(--faint);
    }

    /* Sandwich */
    .sandwich { display: flex; flex-direction: column; gap: 5px; max-width: 440px; margin: 0 auto; }
    .sandwich-layer {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 18px; border-radius: 10px;
      border: 1.5px solid; font-size: 14px;
    }
    .sandwich-label {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600; font-size: 13px;
    }
    .sandwich-type {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; margin-top: 2px; color: var(--muted);
    }

    /* File tree */
    .file-tree {
      font-family: 'JetBrains Mono', monospace; font-size: 13px;
      line-height: 1.9; padding: 4px 0;
    }
    .file-tree-line { display: flex; gap: 10px; }
    .file-tree-path { color: var(--muted); }
    .file-tree-path.active { color: var(--text); font-weight: 600; }
    .file-tree-note { color: var(--accent); font-size: 11px; }

    /* Shape cards */
    .shape-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; padding: 8px 0; }
    .shape-card {
      border-radius: 12px; padding: 14px 18px; text-align: center;
      width: 130px; border: 2px solid;
    }
    .shape-card-icon { font-size: 24px; margin-bottom: 4px; }
    .shape-card-name { font-weight: 700; font-size: 13px; }
    .shape-card-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* Verify layers */
    .verify-stack { display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
    .verify-item {
      display: flex; gap: 12px; align-items: flex-start;
      padding: 10px 14px; border-radius: 10px; border-left: 3px solid;
    }
    .verify-step { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
    .verify-output {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      color: var(--muted); white-space: pre-wrap;
    }

    /* Summary steps */
    .summary-steps { display: flex; flex-direction: column; gap: 12px; padding: 4px 0; }
    .summary-step {
      display: flex; gap: 14px; align-items: center;
      padding: 14px 18px; border-radius: 14px;
      border: 2px solid; border-color: color-mix(in srgb, var(--step-color) 30%, transparent);
      background: color-mix(in srgb, var(--step-color) 6%, transparent);
    }
    .summary-num {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; color: white; flex-shrink: 0;
    }
    .summary-title { font-weight: 800; font-size: 15px; letter-spacing: 0.5px; }
    .summary-desc { font-size: 13px; color: var(--muted); margin-top: 1px; }
    .summary-time {
      font-size: 11px; color: var(--dim); background: #2d3748;
      padding: 3px 10px; border-radius: 20px; flex-shrink: 0; margin-left: auto;
    }

    /* Callout box */
    .callout {
      border-radius: 10px; padding: 14px 18px; margin: 8px 0;
      border-left: 4px solid;
    }
    .callout-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .callout-body { font-size: 13px; color: var(--muted); line-height: 1.6; }

    /* Nav */
    .nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: auto; padding-top: 16px;
      border-top: 1px solid var(--panel-border); gap: 10px;
    }
    .nav-btn {
      padding: 10px 22px; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
      border: 1px solid #2d3748; background: transparent; color: var(--muted);
    }
    .nav-btn:disabled { color: #2d3748; cursor: default; }
    .nav-btn.primary {
      border: none; color: white;
      background: linear-gradient(135deg, var(--accent), #4299e1);
    }
    .nav-btn.primary:disabled { background: #2d3748; color: var(--faint); }
    .dots { display: flex; gap: 4px; }
    .dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: #2d3748; cursor: pointer; transition: all 0.3s;
    }
    .dot.active { width: 20px; background: var(--accent); }
    .dot.past { background: var(--green); }

    /* Keyboard hint */
    .kbd-hint {
      text-align: center; padding: 6px 0; font-size: 11px; color: var(--faint);
    }
    kbd {
      background: #2d3748; padding: 1px 6px; border-radius: 4px;
      font-family: inherit; font-size: 11px;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STEP DEFINITIONS
// ─────────────────────────────────────────────
const STEPS = [

// ━━━ WELCOME ━━━
{
  phase: "Welcome",
  title: "How to Read Code Like an Architect",
  subtitle: "A visual method for this repo \u2014 no coding experience required",
  visual: "welcome",
  desc: `Most people try to read code like a novel \u2014 start at the top, read every line, hope it makes sense by the end. That\u2019s why it feels overwhelming. You\u2019re drowning in details before you understand the shape of the thing.

Instead, you\u2019re going to learn to read code the way you\u2019d explore a new building:

<strong>First the floor plan. Then the rooms. Then the furniture.</strong>

This guide uses the actual code in this repo. Everything you see here is real \u2014 from the label generator tool and the order quote tool. By the end, you\u2019ll have a repeatable 4-step method you can use every time you open any tool in this codebase.`
},

{
  phase: "Welcome",
  title: "What This Repo Actually Does",
  subtitle: "Two sentences, so you have context",
  visual: "repo-overview",
  desc: `This repo contains <strong>business tools</strong> \u2014 things like generating Avery 5160 mailing labels from a spreadsheet, or calculating order quotes with discounts and tax.

Each tool is split into two halves:
\u2022 <em>core/</em> \u2014 the brain. Pure math and logic. Doesn\u2019t touch files, databases, or the web.
\u2022 <em>adapters/</em> \u2014 the hands. Reads files, renders PDFs, handles web requests.

This split is the single most important thing about the codebase. Everything else flows from it. The method you\u2019re about to learn works <strong>because</strong> of this split.`
},

// ━━━ STEP 1: SHAPES ━━━
{
  phase: "Shapes",
  title: "Read the Data Shapes First",
  subtitle: "Learn the nouns before the verbs",
  visual: "shapes-overview",
  desc: `Every tool in this repo has a file called <strong>domain/models.py</strong>. It contains <em>dataclasses</em> \u2014 which are just descriptions of the shapes of data that flow through the program.

Think of them as forms. A doctor\u2019s office has forms: patient intake form, prescription form, referral form. Each form has specific fields. You don\u2019t need to understand medicine to read the forms \u2014 the field names tell you what kind of information flows through the system.

Dataclasses work exactly the same way. Read the names. Read the fields. You\u2019ll understand what the program deals with before you see a single line of logic.`
},

{
  phase: "Shapes",
  title: "LabelFieldConfig \u2014 How a field should look",
  subtitle: "core/label_generator/domain/models.py",
  visual: "code",
  code: [
    ["@dataclass",                       "",      ""],
    ["class LabelFieldConfig:",          "blue",  "\u2190 Configuration for ONE field on a label"],
    ["    column: str | None",           "",      "Which spreadsheet column to pull from"],
    ["    y_in: float",                  "",      "Vertical position in inches"],
    ["    align: str",                   "",      "left, center, or right"],
    ["    font_family: str",             "",      ""],
    ["    font_weight: str",             "",      "Regular or Bold"],
    ["    size_pt: float",               "",      "Font size in points"],
    ["    letter_spacing: float",        "",      ""],
    ["    is_static: bool",              "blue",  "Static = same text on every label"],
    ["    static_text: str",             "",      "The fixed text (if static)"],
    ["    prefix: str",                  "",      'e.g. \"Tel: \" before a phone number'],
    ["    suffix: str",                  "",      ""],
    ["    is_header: bool",              "blue",  "Headers get UPPERCASE + Bold"],
  ],
  desc: `This is the configuration for a single field on a label. Not the data itself \u2014 the <strong>design spec</strong> for how one piece of text should appear.

Imagine you\u2019re designing a mailing label in a word processor. You\u2019d set: which column from my spreadsheet? what font? what size? where on the label? That\u2019s exactly what this dataclass captures.

Notice: there\u2019s nothing here about PDFs, files, or web requests. It\u2019s just a description of intent.`
},

{
  phase: "Shapes",
  title: "LabelJob \u2014 Everything needed for one run",
  subtitle: "The complete input to the brain",
  visual: "code",
  code: [
    ["@dataclass",                       "",      ""],
    ["class LabelJob:",                  "blue",  "\u2190 One complete label generation request"],
    ["    sheet_name: str",              "",      "Which worksheet to use"],
    ["    rows: list[dict[str, Any]]",   "blue",  "\u2190 The actual spreadsheet data"],
    ["    fields: list[LabelFieldConfig]","blue", "\u2190 How to design each field"],
    ["    copies_per_record: int",       "",      "Print 2 copies of each? 5?"],
    ["    use_template: bool",           "",      "Overlay on Avery template?"],
    ["    timestamp_utc: str",           "",      "For the download filename"],
  ],
  desc: `This is the <strong>complete input</strong> to the label generator\u2019s brain. It contains everything the logic needs to make decisions: the data, the design, and the options.

Think of it as a work order. A print shop gets a work order that says: \u201cHere\u2019s the spreadsheet, here\u2019s how each field should look, make 3 copies each, use this template.\u201d That\u2019s a LabelJob.

Key insight: the rows are already loaded. This shape doesn\u2019t know if they came from Excel, CSV, a database, or a web form. <strong>The brain doesn\u2019t care where data comes from.</strong>`
},

{
  phase: "Shapes",
  title: "RenderPlan \u2014 What the brain produces",
  subtitle: "The complete output \u2014 ready for any renderer",
  visual: "code",
  code: [
    ["@dataclass",                       "",       ""],
    ["class RenderPlan:",                "green",  "\u2190 The brain\u2019s complete output"],
    ["    input_rows: int",              "",       "How many rows came in"],
    ["    filtered_rows: int",           "",       "How many survived filtering"],
    ["    total_labels: int",            "green",  "\u2190 After copies expansion"],
    ["    labels_per_page: int",         "",       "30 for Avery 5160"],
    ["    slots: list[LabelSlot]",       "green",  "\u2190 Every label, positioned on a page"],
  ],
  desc: `This is what the brain produces. Not a PDF \u2014 a <strong>plan</strong>. It says: \u201cHere are 90 labels. Each one goes at these exact coordinates on these pages. Here\u2019s the text for each one, already formatted.\u201d

The adapter (the hands) takes this plan and renders it into a real PDF. But the plan itself is pure information. You could render it to PDF, HTML, a printer API, or just display it on screen.

This is why the split matters: <strong>the brain computes, the hands render</strong>. Change the renderer without touching the logic. Change the logic without touching the renderer.`
},

{
  phase: "Shapes",
  title: "The Data Flow \u2014 You Already Know the Story",
  subtitle: "Just from reading four dataclasses",
  visual: "flow-labels",
  desc: `Without reading a single function, you now know:

\u2022 Raw spreadsheet rows come in
\u2022 They get bundled with design config into a <em>LabelJob</em>
\u2022 The brain produces a <em>RenderPlan</em> with positioned, formatted slots
\u2022 Something renders that plan into a PDF

<strong>You\u2019ve read zero logic and you already know the story.</strong>

This works because the code was designed so that the data shapes ARE the story. The shapes are the nouns; the functions are just verbs that transform one noun into another.`
},

{
  phase: "Shapes",
  title: "Bonus: Order Quote Shapes",
  subtitle: "The same pattern, completely different domain",
  visual: "code",
  code: [
    ["# core/order_quote/domain/models.py", "",      ""],
    ["",                                  "",      ""],
    ["class LineItem:",                   "orange","What\u2019s being purchased"],
    ["    sku: str",                      "",      ""],
    ["    quantity: int",                 "",      ""],
    ["    unit_price_cents: int",         "orange","Prices in cents \u2014 no decimals!"],
    ["",                                  "",      ""],
    ["class QuoteRequest:",               "blue",  "Complete input (like LabelJob)"],
    ["    items: list[LineItem]",         "",      ""],
    ["    state: str",                    "",      "For tax calculation"],
    ["    coupon_code: str | None",       "",      ""],
    ["",                                  "",      ""],
    ["class QuoteBreakdown:",             "green", "Complete output (like RenderPlan)"],
    ["    subtotal_cents: int",           "",      ""],
    ["    discount_bps: int",            "",      "Basis points (500 = 5%)"],
    ["    shipping_cents: int",           "",      ""],
    ["    tax_cents: int",                "",      ""],
    ["    total_cents: int",              "green", "The final answer"],
  ],
  desc: `Completely different tool \u2014 same pattern. Input shape, output shape, everything in between is pure math.

Notice the discipline: prices are in <em>cents</em> (integers), not dollars (decimals). Discounts are in <em>basis points</em> (500 = 5%), not percentages (floats). This avoids floating-point rounding bugs. That\u2019s a <strong>decision</strong> captured right in the data shape.

Once you\u2019ve read one tool\u2019s models.py, you know how to read any tool\u2019s models.py. The pattern is always: <strong>input shape \u2192 output shape</strong>.`
},

// ━━━ STEP 2: ORCHESTRATOR ━━━
{
  phase: "Plot",
  title: "Read the Orchestrator Second",
  subtitle: "The table of contents for your program",
  visual: "orchestrator-intro",
  desc: `Now that you know the nouns, it\u2019s time to learn the plot.

Every tool has a file called <strong>application/orchestrator.py</strong>. It\u2019s the shortest file in the entire tool. In this repo, orchestrators are typically <strong>3 lines long</strong>.

The orchestrator is a recipe card. It says: \u201cDo step 1, then step 2, then step 3.\u201d It contains no logic of its own. It doesn\u2019t know HOW any step works \u2014 it just calls them in order.

When you read the orchestrator, you\u2019re reading the <strong>entire plot</strong> of the program in 3 lines.`
},

{
  phase: "Plot",
  title: "Label Generator Orchestrator",
  subtitle: "core/label_generator/application/orchestrator.py \u2014 the whole file",
  visual: "code",
  code: [
    ["def run(payload):",                 "",       "Takes raw input dict"],
    ["",                                  "",       ""],
    ["    job = service.build_job(payload)",     "orange", "\u2190 Step 1: Validate + normalize input"],
    ["",                                  "",       ""],
    ["    plan = service.compute_plan(job)",     "green",  "\u2190 Step 2: All the decisions happen here"],
    ["",                                  "",       ""],
    ["    return service.to_result_dict(job, plan)", "purple", "\u2190 Step 3: Format the output"],
  ],
  desc: `That\u2019s it. That\u2019s the entire program.

<strong>Line 1:</strong> Take the raw payload and validate it. If anything\u2019s wrong (missing fields, bad types), it fails here. If it passes, you get a clean <em>LabelJob</em>.

<strong>Line 2:</strong> Take the validated job and compute the plan. This is where all the interesting decisions happen \u2014 filtering blank rows, expanding copies, calculating positions. Out comes a <em>RenderPlan</em>.

<strong>Line 3:</strong> Take the job and plan and format them into a result dictionary that the adapter can use.

Every tool in this repo follows this same 3-act structure: <strong>validate \u2192 decide \u2192 format output</strong>.`
},

{
  phase: "Plot",
  title: "Order Quote Orchestrator",
  subtitle: "Exact same pattern, different tool",
  visual: "code",
  code: [
    ["def run(payload):",                 "",       ""],
    ["",                                  "",       ""],
    ["    request = service.build_request(payload)",    "orange", "\u2190 Validate: items, state, coupon"],
    ["",                                  "",       ""],
    ["    breakdown = service.build_breakdown(request)","green",  "\u2190 Decide: pricing, discounts, tax"],
    ["",                                  "",       ""],
    ["    return service.to_result_dict(breakdown)",    "purple", "\u2190 Format: serialize to dict"],
  ],
  desc: `See the pattern? Different domain, identical structure.

Once you\u2019ve read one orchestrator, you can read every orchestrator in this repo in about 5 seconds. You just read the function names and you know the plot.

This is by design. The repo has an automated check (<em>check_orchestrator_dumb.py</em>) that enforces: no if-statements, no loops, no try/except, maximum 60 lines. If someone tries to put logic in the orchestrator, the check fails and the code can\u2019t be committed.

The orchestrator is <strong>structurally guaranteed</strong> to be simple.`
},

{
  phase: "Plot",
  title: "See the Sandwich",
  subtitle: "The universal pattern hiding in every orchestrator",
  visual: "sandwich",
  desc: `Every well-structured program follows the same shape \u2014 a sandwich:

The bread on top is <strong>plumbing</strong> (reading input).
The filling is <strong>decisions</strong> (pure logic).
The bread on bottom is <strong>plumbing</strong> (writing output).

In this repo, the core orchestrator is just the filling \u2014 pure decisions. The bread lives in the <em>adapter layer</em> (reading Excel files, rendering PDFs, handling HTTP).

When someone asks \u201ccan we also read from Google Sheets?\u201d \u2014 you change the bread. The filling doesn\u2019t know or care.

When someone asks \u201ccan we change the label positioning logic?\u201d \u2014 you change the filling. The bread doesn\u2019t know or care.`
},

// ━━━ STEP 3: ZOOM ━━━
{
  phase: "Zoom",
  title: "Read Functions Only When You Need To",
  subtitle: "You never need to read the whole codebase",
  visual: "file-map",
  desc: `Each tool has a <strong>FILE_MAP.md</strong> that tells you what lives where:

\u2022 <em>input_validation.py</em> \u2014 Is the input valid? Normalize it.

function renderVisual(step) {
  const v = step.visual;
  if (v === "code") return renderCode(step.code);
  if (v === "welcome") return renderWelcome();
  if (v === "repo-overview") return renderRepoOverview();
  if (v === "shapes-overview") return renderShapesOverview();

function renderCode(lines) {
  if (!lines) return "";
  const colorMap = { blue: "hi", orange: "hi-orange", green: "hi-green", purple: "hi-purple" };
  const noteColorMap = { blue: "", orange: "orange", green: "green", purple: "purple" };
  return `<div class="code-block">${lines.map(([text, color, note]) => {
    const cls = color ? colorMap[color] || "hi" : "";
    const noteCls = color ? noteColorMap[color] || "" : "";
    return `<div class="code-line ${cls}"><span class="code-text">${esc(text) || " "}</span>${note ? `<span class="code-note ${noteCls}">${esc(note)}</span>` : ""}</div>`;
  }).join("")}</div>`;
}

}

// APP ENGINE
// ─────────────────────────────────────────────

const PHASES = ["Welcome", "Shapes", "Plot", "Zoom", "Verify", "Practice", "Method"];
const PHASE_LABELS = {
  Welcome: "Start", Shapes: "Data Shapes", Plot: "Orchestrator",
  Zoom: "Functions", Verify: "Verify", Practice: "Exercises", Method: "Method"
};

let current = 0;

function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render() {
  const step = STEPS[current];
  const total = STEPS.length;
  const pct = (current / (total - 1)) * 100;

  // Progress
  document.getElementById("progress").style.width = pct + "%";

  // Phase nav
  const currentPhaseIdx = PHASES.indexOf(step.phase);
  document.getElementById("phaseNav").innerHTML = PHASES.map((p, i) => {
    let cls = "phase-pill";
    if (i === currentPhaseIdx) cls += " active";
    else if (i < currentPhaseIdx) cls += " done";
    return `<button class="${cls}" data-phase="${p}">${PHASE_LABELS[p]}</button>`;
  }).join("");

  // Step label
  const label = step.phase === "Welcome" || step.phase === "Method" ? step.phase : step.phase;
  document.getElementById("stepLabel").innerHTML =
    `${label} <span class="step-counter">${current + 1} / ${total}</span>`;

  // Content
  document.getElementById("title").textContent = step.title;
  document.getElementById("subtitle").textContent = step.subtitle;
  document.getElementById("visualPanel").innerHTML = renderVisual(step);
  document.getElementById("desc").innerHTML = step.desc;

  // Dots
  document.getElementById("dots").innerHTML = STEPS.map((_, i) => {
    let cls = "dot";
    if (i === current) cls += " active";
    else if (i < current) cls += " past";
    return `<div class="${cls}" data-idx="${i}"></div>`;
  }).join("");

  // Buttons
  document.getElementById("back").disabled = current === 0;
  const nextBtn = document.getElementById("next");
  nextBtn.disabled = current === total - 1;
  nextBtn.textContent = current === total - 1 ? "Done" : "Next \u2192";
}

function go(idx) {
  current = Math.max(0, Math.min(STEPS.length - 1, idx));
  render();
  window.scrollTo(0, 0);
}

// Event delegation
document.getElementById("back").onclick = () => go(current - 1);
document.getElementById("next").onclick = () => go(current + 1);
document.getElementById("dots").onclick = e => {
  const idx = e.target.dataset.idx;
  if (idx != null) go(parseInt(idx));
};
document.getElementById("phaseNav").onclick = e => {
  const phase = e.target.dataset.phase;
  if (!phase) return;
  const idx = STEPS.findIndex(s => s.phase === phase);
  if (idx >= 0) go(idx);
};

// Keyboard nav
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); go(current + 1); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(current - 1); }
});

// Initial render
render();
</script>
</body>
</html>
