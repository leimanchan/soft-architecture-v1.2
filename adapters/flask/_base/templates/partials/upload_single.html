<div class="upload-area{% if extra_class %} {{ extra_class }}{% endif %}" id="{{ upload_id }}" data-upload-input="{{ input_id }}">
    <div class="upload-icon"><i data-lucide="{{ icon }}"></i></div>
    <div class="upload-text">{{ title }}</div>
    {% if hint %}
    <div class="upload-hint form-hint">{{ hint }}</div>
    {% endif %}
</div>
{% if include_input %}
<input class="form-input upload-input" type="file" id="{{ input_id }}" accept="{{ input_accept }}">
{% endif %}
