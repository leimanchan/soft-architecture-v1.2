<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How to Read This Codebase Deeply</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #121a2e;
      --panel-2: #18223a;
      --line: #273353;
      --text: #e7ecf8;
      --muted: #a8b3cf;
      --faint: #7784a8;
      --accent: #72c2ff;
      --gold: #f1c46b;
      --green: #78dba9;
      --violet: #b39dff;
      --warn: #ff9f6b;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(1100px 600px at 10% -10%, #1f2f52 0%, transparent 60%), var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }
    .app {
      display: grid;
      grid-template-columns: 310px 1fr;
      min-height: 100vh;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: #0d1529;
      padding: 18px 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 10px;
    }
    .course-title {
      font-size: 18px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .course-sub {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 14px;
    }
    .progress-wrap {
      margin-bottom: 16px;
    }
    .progress-bar {
      height: 6px;
      background: #1c2743;
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid #293760;
    }
    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--accent), var(--green), var(--violet));
      transition: width .25s ease;
    }
    .progress-text {
      margin-top: 6px;
      font-size: 12px;
      color: var(--faint);
    }
    .list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item {
      border: 1px solid #263458;
      border-radius: 10px;
      padding: 9px 10px;
      cursor: pointer;
      background: #111b34;
      transition: all .2s ease;
    }
    .item:hover {
      border-color: #3c4f7e;
      transform: translateY(-1px);
    }
    .item.active {
      border-color: var(--accent);
      background: #172544;
      box-shadow: 0 0 0 1px rgba(114,194,255,.25) inset;
    }
    .item .phase {
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: 2px;
    }
    .item .name {
      font-size: 12px;
      font-weight: 600;
      color: #dbe4f7;
      line-height: 1.35;
    }

    .main {
      padding: 24px 28px 28px;
      max-width: 1020px;
      width: 100%;
      margin: 0 auto;
    }
    .topline {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .title {
      font-size: 34px;
      line-height: 1.2;
      margin: 0;
      font-weight: 800;
      max-width: 860px;
    }
    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
      max-width: 860px;
    }

    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.00));
      padding: 16px;
    }
    .card h3 {
      margin: 0 0 10px;
      font-size: 14px;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .lecture {
      font-size: 15px;
      line-height: 1.8;
      color: #d1dbef;
      white-space: pre-line;
    }
    .diagram {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.65;
      background: #0f1730;
      border: 1px solid #26365e;
      border-radius: 10px;
      padding: 12px;
      color: #bdd5ff;
      white-space: pre-wrap;
    }
    .listbox {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .bullet {
      border-left: 3px solid #3a4f7f;
      padding: 8px 10px;
      background: #101a33;
      border-radius: 8px;
      color: #c5d3ee;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-line;
    }
    .bullet strong { color: var(--text); }

    .code {
      margin-top: 10px;
      background: #0d1429;
      border: 1px solid #273960;
      border-radius: 10px;
      padding: 10px;
      font-family: var(--mono);
      font-size: 12px;
      overflow: auto;
    }
    .line {
      display: flex;
      gap: 10px;
      padding: 2px 6px;
      border-left: 3px solid transparent;
      border-radius: 4px;
      align-items: baseline;
    }
    .line.hi { border-left-color: var(--accent); background: rgba(114,194,255,.08); }
    .line.warn { border-left-color: var(--warn); background: rgba(255,159,107,.10); }
    .note { color: var(--gold); font-size: 11px; white-space: nowrap; }

    .prof-note {
      margin-top: 16px;
      border: 1px solid #39527f;
      background: #10203f;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.65;
      color: #d9e6ff;
    }
    .prof-note .tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 4px;
      display: inline-block;
    }

    .nav {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    button {
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #365082;
      background: #13244a;
      color: #d8e8ff;
    }
    button:disabled {
      opacity: .45;
      cursor: default;
    }
    .next {
      border: none;
      background: linear-gradient(135deg, #4ea9ff, #4bd0b0);
      color: #052133;
    }

    @media (max-width: 1000px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--line); }
      .main { padding-top: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Studio Seminar</div>
      <div class="course-title">Read Code Like a Systems Thinker</div>
      <div class="course-sub">For technical visual learners who want depth without drowning in syntax.</div>
      <div class="progress-wrap">
        <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressText" class="progress-text"></div>
      </div>
      <div id="lessonList" class="list"></div>
    </aside>

    <main class="main">
      <div id="topline" class="topline"></div>
      <h1 id="title" class="title"></h1>
      <div id="subtitle" class="subtitle"></div>

      <section class="grid">
        <article class="card">
          <h3>Lecture</h3>
          <div id="lecture" class="lecture"></div>
          <div id="code" class="code" hidden></div>
          <div id="prof" class="prof-note" hidden>
            <div class="tag">Professor Note</div>
            <div id="profText"></div>
          </div>
        </article>

        <article class="card">
          <h3>Visual Model</h3>
          <div id="diagram" class="diagram"></div>
          <div class="listbox">
            <div id="inspect" class="bullet"></div>
            <div id="exercise" class="bullet"></div>
          </div>
        </article>
      </section>

      <div class="nav">
        <button id="prevBtn">← Previous</button>
        <button id="nextBtn" class="next">Next →</button>
      </div>
    </main>
  </div>

  <script>
    const LESSONS = [
      {
        phase: "Orientation",
        title: "The Core Promise of This Codebase",
        subtitle: "You are not reading random code. You are reading a designed system.",
        lecture: `This repository is built around one promise: you should be able to change behavior without ripping the whole program apart.\n\nFor a visual learner, think in architecture layers, not lines of code.\n\nLayer 1: Shapes (what exists)\nLayer 2: Decisions (what changes data)\nLayer 3: Adapters (how it touches the world)\n\nYour reading job is to identify which layer you are in, and never confuse them.`,
        diagram: `SYSTEM VIEW\n\n[ INPUT WORLD ] -> [ ADAPTER ] -> [ CORE DECISIONS ] -> [ ADAPTER ] -> [ OUTPUT WORLD ]\n\nAdapters: Flask routes, io.py, presenter.py\nCore: domain models + application decision modules`,
        inspect: "Open first:\n`core/label_generator/domain/models.py`\nQuestion: What are the nouns?",
        exercise: "Say out loud: 'I am reading a system, not a script.'",
        prof: "Mastery starts when you stop asking 'What does this line do?' and start asking 'What job does this file own?'"
      },
      {
        phase: "Map",
        title: "Read the Repo Like a Floor Plan",
        subtitle: "Before logic, orient yourself by folder intent.",
        lecture: `This repo is not organized by technology first. It is organized by responsibility.\n\n` +
          `• core/: business decisions\n• adapters/: framework and I/O edges\n• docs/: rules and teaching artifacts\n• scripts/: governance checks\n\nIf you read in this order, complexity drops fast: core/tool/domain -> core/tool/application/FILE_MAP.md -> core/tool/application/orchestrator.py -> adapter/UI contract.`,
        diagram: `FLOOR PLAN\n\ncore/<tool>/\n  domain/          # nouns\n  application/     # decision rooms\n  contracts.py     # boundary door\n\nadapters/flask/<tool>/\n  app.py           # route shell\n  presenter.py     # translation\n  io.py            # side effects`,
        inspect: "Open:\n`core/label_generator/application/FILE_MAP.md`",
        exercise: "Point to each file and name its single responsibility in one sentence.",
        prof: "A good architecture is a map that teaches itself."
      },
      {
        phase: "Shapes",
        title: "Nouns First: Domain Models",
        subtitle: "Models are the mental anchors for everything else.",
        lecture: `In this repository, domain models are dataclasses with no framework baggage.\n\nFor ` +
          `label_generator, the key progression is:\nLabelFieldConfig -> LabelJob -> LabelSlot -> RenderPlan.\n\nWithout reading a single algorithm, you now understand the story: configure fields, run job, place slots, output plan.`,
        diagram: `SHAPE FLOW\n\nLabelFieldConfig + rows\n        -> LabelJob\n        -> compute_plan()\n        -> RenderPlan(slots)\n        -> adapter render`,
        inspect: "Open:\n`core/label_generator/domain/models.py`\nFind `LabelJob` and `RenderPlan`.",
        exercise: "Write a 2-column note: INPUT shape names vs OUTPUT shape names.",
        prof: "Syntax fades. Shapes stay."
      },
      {
        phase: "Split",
        title: "Why Split Files Matter",
        subtitle: "One file, one burden. This is anti-overwhelm engineering.",
        lecture: `Application logic is intentionally split so each module answers one type of question:\n\n` +
          `• input_validation.py -> Is data valid?\n• planning.py / decision_logic.py -> What decision should happen?\n• output_mapping.py / output_format.py -> How do we serialize result?\n• orchestrator.py -> In what sequence?\n\nThis is the reading advantage: you only open the room where your question lives.`,
        diagram: `APPLICATION FILE OWNERSHIP\n\n[input_validation]  [decision_logic/planning]  [output_mapping]\n          \            |             /\n           \           |            /\n                 [orchestrator]`,
        inspect: "Open:\n`core/order_quote/application/FILE_MAP.md` and compare to label_generator's map.",
        exercise: "If totals are wrong, which file do you open first?",
        prof: "Clarity is not style. Clarity is speed."
      },
      {
        phase: "Boundary",
        title: "Contracts Are the Adapter-Neutral API",
        subtitle: "This is why Flask can be standard without lock-in.",
        lecture: `Each tool exposes contracts in ` +
          "`core/<tool>/contracts.py`: ToolInput -> run() -> ToolOutput.\n\n" +
          `Adapters are interchangeable only because contracts are stable.\n\nFor reading: if you don't know what payload should look like, open contracts + examples first.`,
        diagram: `BOUNDARY RULE\n\nUI/HTTP -> presenter mapping -> ToolInput(payload)\n                           -> contracts.run(...)\n                           -> ToolOutput(result) -> UI/HTTP`,
        inspect: "Open:\n`core/label_generator/contracts.py`\n`core/label_generator/examples/happy_path.json`",
        exercise: "Describe run() in one sentence without saying Flask.",
        prof: "When boundaries are clear, frameworks become replaceable details."
      },
      {
        phase: "Flow",
        title: "Dumb Orchestrator: Read the Plot in 3 Lines",
        subtitle: "No branching, no I/O, no drama.",
        lecture: `A strong orchestrator reads like a recipe. In this repo it should be short and branchless.\n\n` +
          `In label_generator:\n1) build_job(payload)\n2) compute_plan(job)\n3) to_result_dict(job, plan)\n\nIf you see lots of conditions in orchestrator, architecture is drifting.`,
        diagram: `ORCHESTRATOR LENS\n\npayload\n  -> build_job\n  -> compute_plan\n  -> to_result_dict\n  -> result`,
        inspect: "Open:\n`core/label_generator/application/orchestrator.py`",
        exercise: "Could you explain the flow to a teammate in 20 seconds?",
        code: [
          ["def run(payload):", "", ""],
          ["  job = service.build_job(payload)", "hi", "normalize + validate"],
          ["  plan = service.compute_plan(job)", "hi", "decision engine"],
          ["  return service.to_result_dict(job, plan)", "hi", "serialize output"]
        ],
        prof: "A great orchestrator is boring to write and beautiful to maintain."
      },
      {
        phase: "Zoom",
        title: "Question-Driven Reading",
        subtitle: "Never read everything. Read by symptom.",
        lecture: `Use this lookup table:\n\n` +
          `• Payload rejected? -> input_validation.py\n• Wrong computed values? -> decision/planning file\n• Response key mismatch? -> output_mapping/output_format.py\n• UI behavior mismatch? -> adapter presenter + UI_CONTRACT.md\n\nThis turns reading into diagnosis, not wandering.`,
        diagram: `SYMPTOM -> FILE\n\nValidation error -> input_validation\nWrong totals/positions -> decision module\nWrong JSON/PDF name -> output mapping\nRoute mismatch -> presenter / UI_CONTRACT`,
        inspect: "Open:\n`adapters/flask/label_generator/presenter.py` and `adapters/flask/label_generator/UI_CONTRACT.md`",
        exercise: "Take one recent bug and map it to exactly one file to inspect first.",
        prof: "Experts move quickly because they narrow the search space instantly."
      },
      {
        phase: "Adapter",
        title: "Flask Is the Standard Shell, Not the Brain",
        subtitle: "You can prototype fast without polluting core.",
        lecture: `Your strategy is sound: Flask-first for speed, core for longevity.\n\nRead adapter files as a translation pipeline:\n` +
          `request -> presenter parse/build payload -> contracts.run -> io/render response.\n\nIf business rules appear inside adapter, stop and move them to core.`,
        diagram: `ADAPTER TRANSLATION PIPELINE\n\napp.py route\n -> presenter.parse/build\n -> core contracts.run\n -> io.py side effects\n -> response`,
        inspect: "Open:\n`adapters/flask/label_generator/app.py` then `presenter.py` then `io.py`",
        exercise: "Mark which lines are 'translation' vs 'decision'.",
        prof: "Framework speed is an asset only when boundaries keep it from becoming debt."
      },
      {
        phase: "UI",
        title: "UI Contract = Portable Behavior Specification",
        subtitle: "This is how future adapters stay easy.",
        lecture: `UI_CONTRACT.md is not busywork. It is behavior memory.\n\nIt should answer:\n• What routes exist?\n• What payload shapes are expected?\n• What errors and statuses occur?\n• What UI states transition when?\n\nWhen this is clear, an LLM can rebuild UI in another framework without touching core.`,
        diagram: `UI CONTRACT CONTENT\n\nRoutes\nRequest payloads\nResponse shapes\nError statuses\nUI states\nCore binding`,
        inspect: "Open:\n`adapters/flask/label_generator/UI_CONTRACT.md`",
        exercise: "Pick one route and trace it end-to-end into contracts.run.",
        prof: "Unwritten behavior is hidden coupling. Written behavior is architecture."
      },
      {
        phase: "Verification",
        title: "Verify in Layers, Not at the End",
        subtitle: "The stack gives you natural checkpoints.",
        lecture: `When output looks wrong, verify these layers in order:\n\n` +
          `1) Example payload correctness\n2) Presenter-mapped payload\n3) contracts.run result shape + key metrics\n4) Adapter rendering/output response\n\nThis sequence tells you where the defect was introduced.`,
        diagram: `LAYERED DEBUG PATH\n\nexamples -> presenter payload -> contract result -> rendered artifact`,
        inspect: "Run mentally with one generate request from label_generator.",
        exercise: "Identify one numeric sanity metric (`total_labels`, `filtered_rows`) to check before rendering.",
        code: [
          ["payload = presenter.build_generate_payload(body, rows)", "hi", "mapping checkpoint"],
          ["result = run_contract(ToolInput(payload=payload)).result", "hi", "core checkpoint"],
          ["io.render_plan_to_pdf(result, labels_pdf)", "warn", "render boundary"],
          ["return io.pdf_response(output_path, result['download_name'])", "", "transport"]
        ],
        prof: "Debugging is not magic. It is controlled observation at boundaries."
      },
      {
        phase: "Governance",
        title: "Why Checks Exist (and Why They Help You)",
        subtitle: "Automation protects your future attention span.",
        lecture: `This repo's scripts enforce architecture promises:\n\n` +
          `• check_core_purity.py\n• check_core_no_io.py\n• check_orchestrator_dumb.py\n• check_application_split.py\n• check_service_facade.py\n• check_ui_contracts.py\n\nThese checks are guardrails so you don't have to re-audit architecture manually every week.`,
        diagram: `HUMAN INTENT + AUTOMATION\n\nRules in docs\n   +
Checks in scripts\n   =
Reliable structure under change`,
        inspect: "Open:\n`scripts/preflight_core.py` and scan CHECKS list.",
        exercise: "Name one check that protects your biggest pain point.",
        prof: "Good governance is compassion for your future self."
      },
      {
        phase: "Case Study",
        title: "Deep Walkthrough: label_generator",
        subtitle: "A complete reading lap through one real tool.",
        lecture: `Do one full lap in this order:\n\n` +
          `A) domain/models.py -> identify 5 nouns\nB) application/FILE_MAP.md -> identify ownership\nC) orchestrator.py -> identify sequence\nD) planning.py -> inspect one key decision (_slot_coordinates)\nE) adapters/flask/.../UI_CONTRACT.md -> verify route/state contract\n\nAfter one lap, you can reason about most bug reports quickly.`,
        diagram: `LAP\n\nmodels -> FILE_MAP -> orchestrator -> one decision fn -> UI contract`,
        inspect: "Open exactly those five files in sequence.",
        exercise: "Write a 6-line summary titled: 'How label_generator works'.",
        prof: "Depth is not reading more files. Depth is extracting stronger mental models from fewer files."
      },
      {
        phase: "Case Study",
        title: "Cross-Tool Pattern Recognition",
        subtitle: "See sameness across different business domains.",
        lecture: `Now compare ` +
          "`label_generator`, `order_quote`, and `sample_tool`.\n\n" +
          `Different domain, same architecture grammar:\n• shapes\n• split application modules\n• dumb orchestrator\n• contracts boundary\n\nPattern recognition is how reading gets fast.`,
        diagram: `SAME GRAMMAR, DIFFERENT DOMAIN\n\nlabel_generator  order_quote  sample_tool\n     |               |             |\n  contracts        contracts     contracts\n  orchestrator     orchestrator  orchestrator`,
        inspect: "Open the three `application/FILE_MAP.md` files side by side.",
        exercise: "Circle what is structurally identical across all three tools.",
        prof: "Architecture literacy is the ability to spot invariant structure beneath changing features."
      },
      {
        phase: "Synthesis",
        title: "Your Reading Algorithm",
        subtitle: "Use this every time, no exceptions.",
        lecture: `1) Start with domain models (nouns)\n2) Read FILE_MAP (ownership)\n3) Read orchestrator (flow)\n4) Zoom into one decision file\n5) Read adapter UI contract\n6) Verify boundary artifacts\n\nIf you follow this order, abstraction becomes navigable, not overwhelming.`,
        diagram: `READING ALGORITHM\n\nSHAPES -> OWNERSHIP -> FLOW -> DECISION -> CONTRACT -> VERIFY`,
        inspect: "Keep this open while reading real code.",
        exercise: "Run this algorithm on your next bug ticket.",
        prof: "You do not need to memorize code. You need a method that turns complexity into sequence."
      },
      {
        phase: "Capstone",
        title: "How to Think Like the Architect of This Repo",
        subtitle: "Inspiration without illusion.",
        lecture: `You are not behind because code looks abstract. Abstract systems are hard until the map is explicit.\n\nYour architecture now gives that map: split files, contracts, checks, UI contracts, and clear boundaries.\n\nThe goal is not to become a syntax machine. The goal is to become a systems reader who can direct AI and engineers with precision.\n\nThat is exactly what this repository is training you to do.`,
        diagram: `ARCHITECT MINDSET\n\nSee structure first\nName responsibilities clearly\nProtect boundaries\nVerify at seams\nTeach the method`,
        inspect: "Pick one tool and teach its flow to someone else using only file names.",
        exercise: "Final prompt to self: 'What changed? Which boundary owns it? Which file proves it?'",
        prof: "When you can teach the map, you own the system."
      }
    ];

    let index = 0;
    const el = id => document.getElementById(id);

    function renderSidebar() {
      const list = el("lessonList");
      list.innerHTML = "";
      LESSONS.forEach((lesson, i) => {
        const node = document.createElement("button");
        node.className = `item ${i === index ? "active" : ""}`;
        node.innerHTML = `<div class="phase">${lesson.phase}</div><div class="name">${lesson.title}</div>`;
        node.onclick = () => { index = i; render(); };
        list.appendChild(node);
      });
    }

    function renderCode(lines) {
      const box = el("code");
      if (!lines || !lines.length) {
        box.hidden = true;
        box.innerHTML = "";
        return;
      }
      box.hidden = false;
      box.innerHTML = lines.map(([text, tone, note]) => {
        const cls = tone === "warn" ? "warn" : tone === "hi" ? "hi" : "";
        return `<div class="line ${cls}"><span>${text.replace(/</g, "&lt;")}</span>${note ? `<span class="note">${note}</span>` : ""}</div>`;
      }).join("");
    }

    function render() {
      const lesson = LESSONS[index];
      el("topline").textContent = `${lesson.phase.toUpperCase()} · LESSON ${index + 1} OF ${LESSONS.length}`;
      el("title").textContent = lesson.title;
      el("subtitle").textContent = lesson.subtitle;
      el("lecture").textContent = lesson.lecture;
      el("diagram").textContent = lesson.diagram;
      el("inspect").innerHTML = `<strong>Inspect Next</strong><br>${lesson.inspect}`;
      el("exercise").innerHTML = `<strong>Micro Exercise</strong><br>${lesson.exercise}`;
      renderCode(lesson.code);

      const prof = el("prof");
      if (lesson.prof) {
        prof.hidden = false;
        el("profText").textContent = lesson.prof;
      } else {
        prof.hidden = true;
      }

      el("prevBtn").disabled = index === 0;
      el("nextBtn").disabled = index === LESSONS.length - 1;

      const p = ((index + 1) / LESSONS.length) * 100;
      el("progressFill").style.width = `${p}%`;
      el("progressText").textContent = `${Math.round(p)}% complete`;

      renderSidebar();
    }

    el("prevBtn").onclick = () => { if (index > 0) { index -= 1; render(); } };
    el("nextBtn").onclick = () => { if (index < LESSONS.length - 1) { index += 1; render(); } };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" && index < LESSONS.length - 1) { index += 1; render(); }
      if (e.key === "ArrowLeft" && index > 0) { index -= 1; render(); }
    });

    render();
  </script>
</body>
</html>
